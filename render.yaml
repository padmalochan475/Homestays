services:
  - type: web
    name: padmalochan-homestays-api
    runtime: node
    plan: free
    rootDir: api
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_URL
        fromService:
          type: web
          name: padmalochan-homestays-client
          property: host
      - key: MAIL_USERNAME
        sync: false
      - key: OAUTH_CLIENTID
        sync: false
      - key: OAUTH_CLIENT_SECRET
        sync: false
      - key: OAUTH_REFRESH_TOKEN
        sync: false
      - key: AWS_REGION
        value: eu-north-1
      - key: BUCKET_NAME
        sync: false
      - key: S3_ACCESS_KEY
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: ADMIN_EMAIL
        value: admin@homestays.com
      - key: ADMIN_PASSWORD
        value: Admin@123
      - key: HOST_EMAIL
        value: demo@homestays.com
      - key: HOST_PASSWORD
        value: Demo@123

  - type: web
    name: padmalochan-homestays-client
    runtime: static
    rootDir: client
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: padmalochan-homestays-api
          property: host
    routes:
      - type: rewrite
        source: /*
        destination: /index.html